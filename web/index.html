<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>visualz · scaffold</title><body><h1>visualz</h1><p id="connection">Connecting…</p>
<pre id="state"></pre><script>
function connect() {
 const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
 ws.onopen=()=>document.getElementById('connection').textContent='Connected';
 ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state')
 document.getElementById('state').textContent=JSON.stringify(m.state,null,2)};
 ws.onclose=()=>{document.getElementById('connection').textContent='Reconnecting…';setTimeout(connect,1000)};
} connect();
</script></body></html>
